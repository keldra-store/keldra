name: ${KELDRA_QUALIFICATION_PROJECT:-keldra-v090-qualification}

x-keldra-environment: &keldra-environment
  RUST_LOG: ${KELDRA_QUALIFICATION_RUST_LOG:-info,keldra::index_runtime::retention=debug}
  KELDRA_LISTEN: 0.0.0.0:50051
  KELDRA_PEER_LISTEN: 0.0.0.0:50052
  KELDRA_TOKEN_SIGNING_KEY_FILE: /run/secrets/keldra-token-signing-key
  # Qualification starts a fresh CLI process for each operation, so every
  # operation performs a credential exchange. Keep production defaults out of
  # the way while the rate limiter itself remains covered by focused tests.
  KELDRA_RATE_LIMIT_CREDENTIAL_GLOBAL_PER_MINUTE: "6000"
  KELDRA_RATE_LIMIT_CREDENTIAL_GLOBAL_BURST: "1000"
  KELDRA_RATE_LIMIT_CREDENTIAL_CLIENT_PER_MINUTE: "600"
  KELDRA_RATE_LIMIT_CREDENTIAL_CLIENT_BURST: "100"
  KELDRA_ERASURE_DATA_SHARDS: "2"
  KELDRA_ERASURE_PARITY_SHARDS: "1"
  # Keep release qualification honest about the process-wide index bounds.
  # The corpus size can grow independently without silently growing these
  # budgets.
  KELDRA_INDEX_DISK_CACHE_BYTES: "${KELDRA_QUALIFICATION_INDEX_DISK_CACHE_BYTES:-268435456}"
  KELDRA_INDEX_MEMORY_PERCENT: "${KELDRA_QUALIFICATION_INDEX_MEMORY_PERCENT:-5}"
  KELDRA_INDEX_BUILDER_MEMORY_BYTES_PER_KIND: "${KELDRA_QUALIFICATION_INDEX_KIND_BUDGET_BYTES:-67108864}"
  KELDRA_INDEX_PATH_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_PATH_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_METADATA_FILTER_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_METADATA_FILTER_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_TYPED_JSON_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_TYPED_JSON_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_FULL_TEXT_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_FULL_TEXT_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_VECTOR_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_VECTOR_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_HYBRID_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_HYBRID_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_GIT_SOURCE_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_GIT_SOURCE_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_TENSOR_COMPACTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  KELDRA_INDEX_TENSOR_PROJECTION_MAX_LANES: "${KELDRA_QUALIFICATION_INDEX_PROJECTION_MAX_LANES:-4}"
  KELDRA_INDEX_RAYON_WORKERS: "${KELDRA_QUALIFICATION_INDEX_RAYON_WORKERS:-4}"
  # Force the public all-kind workload through genuine four-input compaction;
  # this is qualification configuration, not Keldra's production default.
  KELDRA_INDEX_MAX_SEGMENTS_PER_TIER: "4"
  KELDRA_INDEX_MAX_RETAINED_GENERATIONS: "1"
  # The qualification wrapper temporarily selects a tiny bound only for its
  # isolated pressure phase, then restarts onto this production default before
  # the release corpus.
  KELDRA_SOURCE_JOURNAL_MAX_ENTRIES: "${KELDRA_QUALIFICATION_SOURCE_JOURNAL_MAX_ENTRIES:-1000000}"

x-keldra-service: &keldra-service
  image: ${KELDRA_IMAGE:?KELDRA_IMAGE must name the already-built qualification image}
  platform: ${KELDRA_DOCKER_PLATFORM:-linux/amd64}
  restart: "no"
  stop_grace_period: 30s
  # One random loopback port exercises gRPC, S3 and Git through the shared
  # public listener without exposing a fixed host port.
  ports:
    - "127.0.0.1::50051"

services:
  keldra-1:
    <<: *keldra-service
    environment:
      <<: *keldra-environment
      KELDRA_NODE_ID: "1"
      KELDRA_PEER_ADVERTISE: keldra-1:50052
      KELDRA_DATA_DIR: /var/lib/keldra
      KELDRA_RUN_SYSTEM_BOOTSTRAP: "true"
    volumes:
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/node-1
        target: /var/lib/keldra
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/token-signing-key
        target: /run/secrets/keldra-token-signing-key
        read_only: true

  keldra-2:
    <<: *keldra-service
    entrypoint:
      - /qualification/start-node.sh
    environment:
      <<: *keldra-environment
      KELDRA_NODE_ID: "2"
      KELDRA_PEER_ADVERTISE: keldra-2:50052
      KELDRA_DATA_DIR: /var/lib/keldra
      KELDRA_RUN_SYSTEM_BOOTSTRAP: "false"
    volumes:
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/node-2
        target: /var/lib/keldra
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/token-signing-key
        target: /run/secrets/keldra-token-signing-key
        read_only: true
      - type: bind
        source: ${KELDRA_QUALIFICATION_START_NODE:?KELDRA_QUALIFICATION_START_NODE must be set}
        target: /qualification/start-node.sh
        read_only: true
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/artifacts
        target: /qualification/artifacts

  keldra-3:
    <<: *keldra-service
    entrypoint:
      - /qualification/start-node.sh
    environment:
      <<: *keldra-environment
      KELDRA_NODE_ID: "3"
      KELDRA_PEER_ADVERTISE: keldra-3:50052
      KELDRA_DATA_DIR: /var/lib/keldra
      KELDRA_RUN_SYSTEM_BOOTSTRAP: "false"
    volumes:
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/node-3
        target: /var/lib/keldra
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/token-signing-key
        target: /run/secrets/keldra-token-signing-key
        read_only: true
      - type: bind
        source: ${KELDRA_QUALIFICATION_START_NODE:?KELDRA_QUALIFICATION_START_NODE must be set}
        target: /qualification/start-node.sh
        read_only: true
      - type: bind
        source: ${KELDRA_QUALIFICATION_DIR:?KELDRA_QUALIFICATION_DIR must be set}/artifacts
        target: /qualification/artifacts
