name: ${ANVIL_QUALIFICATION_PROJECT:-anvil-v070-qualification}

x-anvil-environment: &anvil-environment
  RUST_LOG: ${ANVIL_QUALIFICATION_RUST_LOG:-info,anvil::index_runtime::retention=debug}
  ANVIL_LISTEN: 0.0.0.0:50051
  ANVIL_PEER_LISTEN: 0.0.0.0:50052
  ANVIL_TOKEN_SIGNING_KEY_FILE: /run/secrets/anvil-token-signing-key
  # Qualification starts a fresh CLI process for each operation, so every
  # operation performs a credential exchange. Keep production defaults out of
  # the way while the rate limiter itself remains covered by focused tests.
  ANVIL_RATE_LIMIT_CREDENTIAL_GLOBAL_PER_MINUTE: "6000"
  ANVIL_RATE_LIMIT_CREDENTIAL_GLOBAL_BURST: "1000"
  ANVIL_RATE_LIMIT_CREDENTIAL_CLIENT_PER_MINUTE: "600"
  ANVIL_RATE_LIMIT_CREDENTIAL_CLIENT_BURST: "100"
  ANVIL_ERASURE_DATA_SHARDS: "2"
  ANVIL_ERASURE_PARITY_SHARDS: "1"
  # Keep release qualification honest about the process-wide index bounds.
  # The corpus size can grow independently without silently growing these
  # budgets.
  ANVIL_INDEX_DISK_CACHE_BYTES: "${ANVIL_QUALIFICATION_INDEX_DISK_CACHE_BYTES:-268435456}"
  ANVIL_INDEX_MEMORY_PERCENT: "${ANVIL_QUALIFICATION_INDEX_MEMORY_PERCENT:-5}"
  ANVIL_INDEX_BUILDER_MEMORY_BYTES_PER_KIND: "${ANVIL_QUALIFICATION_INDEX_KIND_BUDGET_BYTES:-33554432}"
  ANVIL_INDEX_PATH_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_METADATA_FILTER_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_TYPED_JSON_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_FULL_TEXT_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_VECTOR_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_HYBRID_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_GIT_SOURCE_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_TENSOR_COMPACTION_MAX_LANES: "${ANVIL_QUALIFICATION_INDEX_COMPACTION_MAX_LANES:-4}"
  ANVIL_INDEX_RAYON_WORKERS: "${ANVIL_QUALIFICATION_INDEX_RAYON_WORKERS:-4}"
  ANVIL_INDEX_MAX_RETAINED_GENERATIONS: "1"
  # A bounded qualification-only retention window makes the journal-gap
  # recovery gate deterministic without changing production defaults.
  ANVIL_WATCH_MAX_ENTRIES: "${ANVIL_QUALIFICATION_WATCH_MAX_ENTRIES:-64}"

x-anvil-service: &anvil-service
  image: ${ANVIL_IMAGE:?ANVIL_IMAGE must name the already-built qualification image}
  platform: ${ANVIL_DOCKER_PLATFORM:-linux/amd64}
  restart: "no"
  stop_grace_period: 30s
  # One random loopback port exercises gRPC, S3 and Git through the shared
  # public listener without exposing a fixed host port.
  ports:
    - "127.0.0.1::50051"

services:
  anvil-1:
    <<: *anvil-service
    environment:
      <<: *anvil-environment
      ANVIL_NODE_ID: "1"
      ANVIL_PEER_ADVERTISE: anvil-1:50052
      ANVIL_DATA_DIR: /var/lib/anvil
      ANVIL_RUN_SYSTEM_BOOTSTRAP: "true"
    volumes:
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/node-1
        target: /var/lib/anvil
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/token-signing-key
        target: /run/secrets/anvil-token-signing-key
        read_only: true

  anvil-2:
    <<: *anvil-service
    entrypoint:
      - /qualification/start-node.sh
    environment:
      <<: *anvil-environment
      ANVIL_NODE_ID: "2"
      ANVIL_PEER_ADVERTISE: anvil-2:50052
      ANVIL_DATA_DIR: /var/lib/anvil
      ANVIL_RUN_SYSTEM_BOOTSTRAP: "false"
    volumes:
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/node-2
        target: /var/lib/anvil
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/token-signing-key
        target: /run/secrets/anvil-token-signing-key
        read_only: true
      - type: bind
        source: ${ANVIL_QUALIFICATION_START_NODE:?ANVIL_QUALIFICATION_START_NODE must be set}
        target: /qualification/start-node.sh
        read_only: true
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/artifacts
        target: /qualification/artifacts

  anvil-3:
    <<: *anvil-service
    entrypoint:
      - /qualification/start-node.sh
    environment:
      <<: *anvil-environment
      ANVIL_NODE_ID: "3"
      ANVIL_PEER_ADVERTISE: anvil-3:50052
      ANVIL_DATA_DIR: /var/lib/anvil
      ANVIL_RUN_SYSTEM_BOOTSTRAP: "false"
    volumes:
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/node-3
        target: /var/lib/anvil
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/token-signing-key
        target: /run/secrets/anvil-token-signing-key
        read_only: true
      - type: bind
        source: ${ANVIL_QUALIFICATION_START_NODE:?ANVIL_QUALIFICATION_START_NODE must be set}
        target: /qualification/start-node.sh
        read_only: true
      - type: bind
        source: ${ANVIL_QUALIFICATION_DIR:?ANVIL_QUALIFICATION_DIR must be set}/artifacts
        target: /qualification/artifacts
