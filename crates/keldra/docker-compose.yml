services:
  keldra:
    image: ${KELDRA_IMAGE:-ghcr.io/keldra-store/keldra:0.13.0}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      KELDRA_LISTEN: 0.0.0.0:50051
      KELDRA_DATA_DIR: /var/lib/keldra
      KELDRA_NODE_ID: ${KELDRA_NODE_ID:-1}
      KELDRA_TOKEN_SIGNING_KEY_FILE: /run/secrets/keldra-token-signing-key
      KELDRA_RUN_SYSTEM_BOOTSTRAP: ${KELDRA_RUN_SYSTEM_BOOTSTRAP:-false}
      KELDRA_MAX_ATOMIC_COMMIT_ENTRIES: ${KELDRA_MAX_ATOMIC_COMMIT_ENTRIES:-4096}
      KELDRA_MAX_ATOMIC_COMMIT_BYTES: ${KELDRA_MAX_ATOMIC_COMMIT_BYTES:-16777216}
      KELDRA_AWAITING_PUBLISH_TTL_SECONDS: ${KELDRA_AWAITING_PUBLISH_TTL_SECONDS:-86400}
      KELDRA_MUTATION_RECEIPT_RETENTION_SECONDS: ${KELDRA_MUTATION_RECEIPT_RETENTION_SECONDS:-86400}
      KELDRA_MAX_MUTATION_RECEIPT_ENTRIES: ${KELDRA_MAX_MUTATION_RECEIPT_ENTRIES:-2000000}
      KELDRA_MAX_MUTATION_RECEIPT_BYTES: ${KELDRA_MAX_MUTATION_RECEIPT_BYTES:-536870912}
      KELDRA_SOURCE_JOURNAL_MAX_ENTRIES: ${KELDRA_SOURCE_JOURNAL_MAX_ENTRIES:-1000000}
      KELDRA_SOURCE_JOURNAL_MAX_BYTES: ${KELDRA_SOURCE_JOURNAL_MAX_BYTES:-536870912}
    ports:
      - "50051:50051"
    volumes:
      - keldra_data:/var/lib/keldra
      - ${KELDRA_TOKEN_SIGNING_KEY_FILE:?KELDRA_TOKEN_SIGNING_KEY_FILE must name a mode-0600 file}:/run/secrets/keldra-token-signing-key:ro
    restart: unless-stopped

volumes:
  keldra_data:
