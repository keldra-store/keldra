syntax = "proto3";

package keldra.cluster_peer.v1;

import "keldra.proto";
import "personaldb.proto";

// Versioned identity and placement binding shared by every cluster operation.
// The authenticated source is still established by mandatory mTLS; these
// fields bind that identity to the exact applied membership used by the
// caller. hop_count is zero for replica/source operations and exactly one for
// a routed public operation.
message PeerContext {
  uint32 schema_version = 1;
  bytes cluster_id = 2;
  uint64 source_node_id = 3;
  uint64 placement_term = 4;
  uint64 placement_index = 5;
  uint32 hop_count = 6;
  uint32 remaining_deadline_millis = 7;
}

message LogicalRecordReadRequest {
  PeerContext peer = 1;
  bytes id_json = 2;
}

