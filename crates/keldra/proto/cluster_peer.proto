}

message AccountingTrafficEntry {
  string exact_path = 1;
  uint64 accepted_inbound_bytes = 2;
  uint64 served_outbound_bytes = 3;
}

// One bounded source batch sent to the current weighted-HRW bucket matcher.
// The matcher resolves the bucket's sparse accounting definitions and forwards
// idempotent per-definition totals to each rank-zero accounting builder.
message MatchAccountingTrafficRequest {
  PeerContext peer = 1;
  uint64 source_node_id = 2;
  bytes source_epoch = 3;
  uint64 sequence = 4;
  uint64 tenant_id = 5;
  uint64 bucket_id = 6;
  repeated AccountingTrafficEntry entries = 7;
}

message MatchAccountingTrafficResponse {
  uint32 schema_version = 1;
}

message InvalidateAccountingMatcherBucketRequest {
  PeerContext peer = 1;
  uint64 tenant_id = 2;
  uint64 bucket_id = 3;
}

message ClearAccountingMatcherCacheRequest {
  PeerContext peer = 1;
}

message AccountingMatcherCacheInvalidated {
  uint32 schema_version = 1;
}

// This service is installed only on Keldra's mandatory-mTLS peer listener.
// It exposes typed logical operations, never RocksDB keys, column-family
// values, or a generic public-method tunnel.
service ClusterPeer {
  rpc ResolveTenantName(ResolveTenantNameRequest) returns (ResolveTenantNameResult);
  rpc ResolveBucketName(ResolveBucketNameRequest) returns (ResolveBucketNameResult);
  rpc ReadLogicalRecord(LogicalRecordReadRequest) returns (LogicalRecordCandidate);
  rpc RepairLogicalRecord(LogicalRecordRepairRequest) returns (LogicalRecordSnapshotApplied);
  rpc ApplyLogicalRecord(LogicalRecordMutationRequest) returns (LogicalRecordApplied);

  rpc ApplySchemaPublication(SchemaPublicationApplyRequest) returns (SchemaPublicationApplied);
  rpc HasSchemaPublication(SchemaPublicationQueryRequest) returns (Exists);
  rpc ApplyRealmMutation(RealmMutationApplyRequest) returns (RealmMutationApplied);
  rpc ReadRealmCandidate(RealmCandidateReadRequest) returns (RealmCandidate);
  rpc ReadRealmAggregate(RealmAggregateReadRequest) returns (stream RealmAggregateFrame);
  rpc InstallRealmCandidate(stream RealmCandidateInstallFrame) returns (RealmCandidateInstalled);
  rpc FreshAuthorizationCheck(FreshAuthorizationCheckRequest) returns (FreshAuthorizationCheckResult);
  rpc FreshAuthorizationChecks(FreshAuthorizationChecksRequest) returns (FreshAuthorizationChecksResult);

  rpc ReadReferenceProof(ReferenceProofReadRequest) returns (ReferenceProofReadResponse);
  rpc ListLocalObjects(LocalListRequest) returns (LocalListPage);
  rpc GetWatchStatus(WatchStatusRequest) returns (WatchStatus);
  rpc ReadWatchPage(WatchPageRequest) returns (WatchPage);

  rpc RoutePutEnd(RoutePutEndRequest) returns (keldra.v1.MutationReceipt);
  rpc RouteDelete(RouteDeleteRequest) returns (keldra.v1.MutationReceipt);
  rpc RouteDeleteIfVersion(RouteDeleteIfVersionRequest) returns (keldra.v1.MutationReceipt);
  rpc RouteBulkWrite(RouteBulkWriteRequest) returns (keldra.v1.BulkWriteResponse);
  // Dedicated mandatory-mTLS routes for an in-process trusted adapter. The
  // internal capability is reconstructed at the destination and is never a
  // protobuf field or caller-controlled metadata value.
  rpc RouteInternalPutEnd(RoutePutEndRequest) returns (keldra.v1.MutationReceipt);
  rpc RouteInternalDeleteIfVersion(RouteDeleteIfVersionRequest) returns (keldra.v1.MutationReceipt);
  rpc RouteInternalBulkWrite(RouteBulkWriteRequest) returns (keldra.v1.BulkWriteResponse);
  rpc RouteProvisionTenant(RouteProvisionTenantRequest) returns (keldra.v1.ProvisionTenantResponse);
  rpc RouteCreateBucket(RouteCreateBucketRequest) returns (keldra.v1.CreateBucketResponse);
  rpc RouteCredentialExchange(RouteCredentialExchangeRequest) returns (keldra.v1.AccessToken);
  rpc RouteAdminCreateApplication(RouteAdminCreateApplicationRequest) returns (keldra.v1.ApplicationCredential);
  rpc RouteAdminRotateCredential(RouteAdminRotateCredentialRequest) returns (keldra.v1.ApplicationCredential);
  rpc RouteAdminRecoverCredential(RouteAdminRecoverCredentialRequest) returns (keldra.v1.ApplicationCredential);
  rpc RouteAdminDisableCredential(RouteAdminDisableCredentialRequest) returns (keldra.v1.ApplicationCredentialState);
  rpc RouteAdminSetBucketVersioning(RouteAdminSetBucketVersioningRequest) returns (keldra.v1.SetBucketVersioningResponse);
  rpc RouteAdminSetBucketPublicRead(RouteAdminSetBucketPublicReadRequest) returns (keldra.v1.SetBucketPublicReadResponse);
  rpc RouteAdminChangeApplicationRole(RouteAdminChangeApplicationRoleRequest) returns (keldra.v1.ApplicationRoleResponse);
  rpc RouteInvokeProgram(RouteInvokeProgramRequest) returns (keldra.v1.InvokeProgramResponse);
