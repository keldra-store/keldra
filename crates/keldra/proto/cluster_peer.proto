message FlushAccountingTrafficRequest {
  PeerContext peer = 1;
  uint64 accounting_id = 2;
  uint64 source_node_id = 3;
  uint64 accepted_inbound_bytes = 4;
  uint64 served_outbound_bytes = 5;
  string flush_id = 6;
  uint64 tenant_id = 7;
  uint64 bucket_id = 8;
}

message FlushAccountingTrafficResponse {
