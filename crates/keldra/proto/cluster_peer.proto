// Narrow internal route for one immutable index artifact or CAS current
// pointer. The authenticated caller must be this index's current weighted-HRW
// builder. Bytes remain on the ordinary upload-source node and the destination
// enters the normal object coordinator pipeline.
message PublishIndexArtifactRequest {
  PeerContext peer = 1;
  string storage_tenant = 2;
  string bucket = 3;
  uint64 tenant_id = 4;
  uint64 bucket_id = 5;
  uint64 index_id = 6;
  string exact_path = 7;
  bytes blob_blake3 = 8;
  uint64 blob_length = 9;
  optional uint64 expected_version = 10;
  string command_id = 11;
  // Non-zero only for a trusted ordinary definition mutation. Generic index
  // and accounting artifacts leave this unspecified.
  RoutedDefinitionKind definition_kind = 12;
  // Present together only for current-pointer/accounting-rollup publication.
  // The first hop is routed to this definition path's coordinator, which
  // holds its ordinary exact-path lock through the artifact CAS.
  RoutedDefinitionKind guarded_definition_kind = 13;
  string guarded_definition_path = 14;
  uint64 guarded_definition_version = 15;
  // Private builder-selected admission. Only an authenticated current HRW
  // builder may send this peer request; public APIs cannot set it.
  bool publication_progress = 16;
}

// Second hop emitted only by the authenticated definition-path coordinator
// while it still holds the ordinary definition lock.
message CommitGuardedIndexArtifactRequest {
  PeerContext peer = 1;
  uint64 builder_node_id = 2;
  PublishIndexArtifactRequest publication = 3;
}

message IndexArtifactPublished {
  uint32 schema_version = 1;
  uint64 version = 2;
  bool replayed = 3;
}

// Bounded internal publication for immutable artifacts which share one exact
// metadata replica group. Nested items carry no PeerContext; the outer mTLS
// request authenticates the current weighted-HRW builder once.
message PublishIndexArtifactsRequest {
  PeerContext peer = 1;
  repeated PublishIndexArtifactRequest publications = 2;
}

message IndexArtifactsPublished {
  uint32 schema_version = 1;
  repeated IndexArtifactPublished outcomes = 2;
}

// Deletes exactly one obsolete immutable generation artifact through the
// ordinary DeleteIfVersion path. `current` and definitions are never valid.
message DeleteIndexArtifactRequest {
  PeerContext peer = 1;
  string storage_tenant = 2;
  string bucket = 3;
  uint64 tenant_id = 4;
  uint64 bucket_id = 5;
  uint64 index_id = 6;
  string exact_path = 7;
  uint64 expected_version = 8;
  string command_id = 9;
  RoutedDefinitionKind definition_kind = 10;
}

message IndexArtifactDeleted {
  uint32 schema_version = 1;
  uint64 version = 2;
  bool replayed = 3;
}

// Every retained descriptor beneath one exact format-v4 Keldra-owned index
// artifact prefix. The server derives the prefix from index_id; peers cannot
// widen it.
message IndexArtifactHeads {
  uint64 tenant_id = 1;
  uint64 bucket_id = 2;
  uint64 index_id = 3;
}

// A bounded format-v4 index-maintenance scan. Pages are retained
// `(path, version)` records and the scope is always one exact index ID.
message ScanIndexHeadsRequest {
  PeerContext peer = 1;
  optional string cursor = 2;
  IndexArtifactHeads artifacts = 4;
}

message IndexHeadScanPage {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes source_epoch = 3;
  uint64 placement_term = 4;
  uint64 placement_index = 5;
  repeated bytes heads_json = 6;
  optional string next_cursor = 7;
}

// Begin one gap-free, ephemeral rebuild cursor. The small acknowledgement
// contains only the snapshot identity and captured source tail.
message IndexSourceSnapshotBegin {
  PeerContext peer = 1;
  uint64 tenant_id = 2;
  uint64 bucket_id = 3;
  string path_prefix = 4;
  uint64 max_frame_bytes = 5;
}

// One pull credit. The server may decode and return exactly one frame only
// after receiving this command; a builder sends it while holding its kind
// memory permit.
message IndexSourceSnapshotPull {
  uint64 sequence = 1;
}

message IndexSourceSnapshotRequest {
  oneof command {
    IndexSourceSnapshotBegin begin = 1;
    IndexSourceSnapshotPull pull = 2;
  }
}

message IndexSourceSnapshotBegun {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes source_epoch = 3;
  uint64 captured_source_tail = 4;
  uint64 placement_term = 5;
  uint64 placement_index = 6;
}

message IndexSourceSnapshotFrame {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes source_epoch = 3;
  uint64 captured_source_tail = 4;
  uint64 placement_term = 5;
  uint64 placement_index = 6;
  uint64 sequence = 7;
  repeated bytes heads_json = 8;
  bool end = 9;
}

message IndexSourceSnapshotResponse {
  oneof event {
    IndexSourceSnapshotBegun begun = 1;
    IndexSourceSnapshotFrame frame = 2;
  }
}

// Credit-driven retained `(path, version)` snapshot used by accounting
// baselines. It is deliberately separate from the current-head rebuild stream
// so neither consumer can accidentally decode the other record shape.
message RetainedSourceSnapshotBegin {
  PeerContext peer = 1;
  uint64 tenant_id = 2;
  uint64 bucket_id = 3;
  string path_prefix = 4;
  uint64 max_frame_bytes = 5;
}

message RetainedSourceSnapshotRequest {
  oneof command {
    RetainedSourceSnapshotBegin begin = 1;
    IndexSourceSnapshotPull pull = 2;
  }
}

message RetainedSourceSnapshotFrame {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes source_epoch = 3;
  uint64 captured_source_tail = 4;
  uint64 placement_term = 5;
  uint64 placement_index = 6;
  uint64 sequence = 7;
  repeated bytes records_json = 8;
  bool end = 9;
}

message RetainedSourceSnapshotResponse {
  oneof event {
    IndexSourceSnapshotBegun begun = 1;
    RetainedSourceSnapshotFrame frame = 2;
  }
}

// One decoded, signed public continuation. The public JWT itself is verified
// by ingress; the destination independently verifies the original bearer and
// requires this Zanzibar revision to remain current before returning results.
message RoutedIndexQueryResume {
  uint64 generation = 1;
  bytes last_position = 2;
  uint64 authorization_revision = 3;
}

// A one-hop request to exactly one current weighted-HRW query replica. No
// Caller or authorization decision crosses the wire. The original access JWT
// or fixed anonymous marker is carried in gRPC metadata; the destination
// independently binds it to storage_tenant and evaluates Zanzibar.
message RouteIndexQueryRequest {
  PeerContext peer = 1;
  uint64 tenant_id = 2;
  uint64 bucket_id = 3;
  keldra.v1.IndexDefinition definition = 4;
  keldra.v1.IndexQuery query = 5;
  uint32 limit = 6;
  optional RoutedIndexQueryResume resume = 7;
  string storage_tenant = 8;
}

// Raw generation results. Public page tokens are minted only by public ingress
// after its own final authorization pass; replicas return engine positions.
message RoutedIndexQueryResponse {
  uint32 schema_version = 1;
  repeated keldra.v1.IndexQueryHit hits = 2;
  keldra.v1.IndexFreshness freshness = 3;
  optional bytes next_position = 4;
  // The peer-routing fence is distinct from freshness. Freshness retains the
  // fence under which the returned generation was built.
  uint64 routing_placement_term = 5;
  uint64 routing_placement_index = 6;
  repeated keldra.v1.IndexFacetResult facet_results = 7;
  repeated keldra.v1.IndexAggregateResult aggregate_results = 8;
}

