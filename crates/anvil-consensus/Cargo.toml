[package]
name = "anvil-consensus"
version = "0.5.5"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96.0"
description = "Bounded consensus decisions for Anvil atomic programs"
publish = false

[dependencies]
bincode = "1.3.3"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
openraft = { version = "=0.9.24", features = ["serde", "storage-v2"] }
prost = "0.14"
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["net", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
