[package]
name = "anvil-consensus"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/worka-ai/anvil"
rust-version = "1.96.0"
description = "Bounded consensus decisions for Anvil atomic programs"
publish = false

[dependencies]
async-trait = "0.1.89"
bincode = "1.3.3"
openraft = { version = "=0.9.24", features = ["serde", "storage-v2"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
