syntax = "proto3";

package keldra.peer.v1;

// Private, mTLS-only transport for the compact Anvil decision Raft group and
// its transient serving fence.
service RaftPeer {
  rpc AppendEntries(RaftRequest) returns (RaftResponse);
  rpc Vote(RaftRequest) returns (RaftResponse);
  rpc InstallSnapshot(RaftRequest) returns (RaftResponse);
  rpc GrantServingLease(RaftRequest) returns (RaftResponse);
}

// Versioned envelope around one bounded internal peer payload.
message RaftRequest {
  uint32 schema_version = 1;
  bytes cluster_id = 2;
  uint64 source_node_id = 3;
  bytes payload = 4;
}

message RaftResponse {
  uint32 schema_version = 1;
  bytes payload = 2;
}
