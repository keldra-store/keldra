[package]
name = "keldra-cli"
version.workspace = true
edition.workspace = true
description = "Command-line client for Keldra"
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "keldra"
path = "src/main.rs"

[dependencies]
keldra-storage = { package = "keldra", path = "../../clients/rust" }
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport"] }

[dev-dependencies]
tempfile = "3"
