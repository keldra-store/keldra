syntax = "proto3";

package anvil.v1;

// One authenticated exchange with the PersonalDB v0 server protocol.
// `frame_json` is the canonical JSON encoding of PersonalDB's versioned
// WireFrame. Keeping the protocol frame intact lets PersonalDB clients use
// the same message schema over gRPC without Anvil maintaining a second copy.
message PersonalDbExchangeRequest {
  string bucket = 1;
  bytes frame_json = 2;
}

// A protocol request can produce more than one response, stream-open, or
// notification frame. Frames retain the order produced by the PersonalDB
// state machine.
message PersonalDbExchangeResponse {
  repeated bytes frame_json = 1;
}

// The v0 PersonalDB WireFrame deliberately carries application/session
// messages, but its CoordinatorClient authority boundary is a separate API.
// These requests keep PersonalDB's own canonical JSON types intact instead of
// duplicating them as Anvil protobuf messages.
message PersonalDbGrantLeaderLeaseRequest {
  string bucket = 1;
  bytes database_id_json = 2;
  bytes leader_replica_json = 3;
  uint64 duration_millis = 4;
}

message PersonalDbGrantLeaderLeaseResponse {
  bytes leader_lease_json = 1;
}

message PersonalDbRenewLeaderLeaseRequest {
  string bucket = 1;
  bytes leader_lease_json = 2;
  uint64 duration_millis = 3;
}

message PersonalDbRenewLeaderLeaseResponse {
  bytes leader_lease_json = 1;
}

message PersonalDbWitnessCommitRequest {
  string bucket = 1;
  bytes proposed_log_entry_json = 2;
  repeated bytes voter_ack_json = 3;
}

message PersonalDbWitnessCommitResponse {
  bytes committed_entry_json = 1;
}

service PersonalDbService {
  rpc Exchange(PersonalDbExchangeRequest) returns (PersonalDbExchangeResponse);
  rpc GrantLeaderLease(PersonalDbGrantLeaderLeaseRequest) returns (PersonalDbGrantLeaderLeaseResponse);
  rpc RenewLeaderLease(PersonalDbRenewLeaderLeaseRequest) returns (PersonalDbRenewLeaderLeaseResponse);
  rpc WitnessCommit(PersonalDbWitnessCommitRequest) returns (PersonalDbWitnessCommitResponse);
}
