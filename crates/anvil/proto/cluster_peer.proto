syntax = "proto3";

package anvil.cluster_peer.v1;

import "anvil.proto";
import "personaldb.proto";

// Versioned identity and placement binding shared by every cluster operation.
// The authenticated source is still established by mandatory mTLS; these
// fields bind that identity to the exact applied membership used by the
// caller. hop_count is zero for replica/source operations and exactly one for
// a routed public operation.
message PeerContext {
  uint32 schema_version = 1;
  bytes cluster_id = 2;
  uint64 source_node_id = 3;
  uint64 placement_term = 4;
  uint64 placement_index = 5;
  uint32 hop_count = 6;
  uint32 remaining_deadline_millis = 7;
}

message LogicalRecordReadRequest {
  PeerContext peer = 1;
  bytes id_json = 2;
}

message ResolveTenantNameRequest {
  PeerContext peer = 1;
  string storage_tenant = 2;
}

message ResolveTenantNameResult {
  uint32 schema_version = 1;
  bool present = 2;
  uint64 tenant_id = 3;
}

message ResolveBucketNameRequest {
  PeerContext peer = 1;
  uint64 tenant_id = 2;
  string bucket = 3;
}

message ResolveBucketNameResult {
  uint32 schema_version = 1;
  bool present = 2;
  uint64 bucket_id = 3;
}

message LogicalRecordCandidate {
  uint32 schema_version = 1;
  bool present = 2;
  bytes candidate_json = 3;
}

message LogicalRecordRepairRequest {
  PeerContext peer = 1;
  bytes id_json = 2;
  bool present = 3;
  bytes candidate_json = 4;
}

message LogicalRecordMutationRequest {
  PeerContext peer = 1;
  bytes mutation_json = 2;
}

message LogicalRecordApplied {
  uint32 schema_version = 1;
  uint64 record_version = 2;
  bool replayed = 3;
}

message LogicalRecordSnapshotApplied {
  uint32 schema_version = 1;
  bool present = 2;
  uint64 record_version = 3;
  bool replayed = 4;
}

message SchemaPublicationApplyRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes mutation_json = 3;
}

message SchemaPublicationApplied {
  uint32 schema_version = 1;
  uint64 revision = 2;
  bool replayed = 3;
}

message SchemaPublicationQueryRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes query_json = 3;
}

message RealmMutationApplyRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes mutation_json = 3;
}

message RealmMutationApplied {
  uint32 schema_version = 1;
  uint64 revision = 2;
  bool replayed = 3;
}

message RealmCandidateReadRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes scope_json = 3;
}

message RealmCandidate {
  uint32 schema_version = 1;
  bool present = 2;
  bytes manifest_json = 3;
}

message RealmAggregateReadRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes scope_json = 3;
}

message RealmAggregateFrame {
  uint32 schema_version = 1;
  uint64 offset = 2;
  bytes content = 3;
  bool end = 4;
  bytes manifest_json = 5;
}

message RealmCandidateInstallFrame {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes scope_json = 3;
  bool present = 4;
  bytes manifest_json = 5;
  uint64 offset = 6;
  bytes content = 7;
  bool end = 8;
}

message RealmCandidateInstalled {
  uint32 schema_version = 1;
  uint64 revision = 2;
  bool replayed = 3;
  uint64 retained_receipts = 4;
}

enum AuthorizationConsistencyMode {
  AUTHORIZATION_CONSISTENCY_LATEST = 0;
  AUTHORIZATION_CONSISTENCY_AT_LEAST = 1;
  AUTHORIZATION_CONSISTENCY_EXACT = 2;
}

message StableBucketBinding {
  string storage_tenant = 1;
  string bucket = 2;
  uint64 expected_tenant_id = 3;
  uint64 expected_bucket_id = 4;
}

message FreshAuthorizationCheckRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes scope_json = 3;
  bytes check_json = 4;
  AuthorizationConsistencyMode consistency = 5;
  uint64 consistency_revision = 6;
  optional StableBucketBinding stable_bucket = 7;
}

message FreshAuthorizationCheckResult {
  uint32 schema_version = 1;
  bool allowed = 2;
  uint64 revision = 3;
  uint64 binding_generation = 4;
}

message FreshAuthorizationChecksRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  bytes scope_json = 3;
  repeated bytes checks_json = 4;
  AuthorizationConsistencyMode consistency = 5;
  uint64 consistency_revision = 6;
  repeated StableBucketBinding stable_buckets = 7;
}

message FreshAuthorizationChecksResult {
  uint32 schema_version = 1;
  repeated bool allowed = 2;
  uint64 revision = 3;
  uint64 binding_generation = 4;
}

message Exists {
  uint32 schema_version = 1;
  bool exists = 2;
}

message ReferenceProofReadRequest {
  PeerContext peer = 1;
  bytes source_id_json = 2;
  uint64 source_offset = 3;
  uint64 tenant_id = 4;
  uint64 bucket_id = 5;
  string exact_path = 6;
}

message ReferenceProofReadResponse {
  uint32 schema_version = 1;
  bool present = 2;
  bytes proof_json = 3;
}

message LocalListRequest {
  PeerContext peer = 1;
  string tenant = 2;
  string bucket = 3;
  uint64 tenant_id = 4;
  uint64 bucket_id = 5;
  string prefix = 6;
  optional string start_after = 7;
  uint32 limit = 8;
  bool include_index_definitions = 9;
  bool include_personaldb_objects = 10;
}

message LocalListPage {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  uint64 placement_term = 3;
  uint64 placement_index = 4;
  repeated string paths = 5;
  bool has_more = 6;
}

message WatchStatusRequest {
  PeerContext peer = 1;
  bytes scope_json = 2;
}

message WatchStatus {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  uint64 placement_term = 3;
  uint64 placement_index = 4;
  bytes source_id_json = 5;
  uint64 tail = 6;
  uint64 retention_floor = 7;
  uint64 retained_entries = 8;
  uint64 retained_bytes = 9;
}

message WatchPageRequest {
  PeerContext peer = 1;
  bytes expected_source_json = 2;
  bytes scope_json = 3;
  uint64 next_offset = 4;
  uint32 max_records = 5;
}

message WatchPage {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  uint64 placement_term = 3;
  uint64 placement_index = 4;
  bytes source_id_json = 5;
  uint64 tail = 6;
  uint64 retention_floor = 7;
  uint64 retained_entries = 8;
  uint64 retained_bytes = 9;
  uint64 next_offset = 10;
  repeated bytes object_heads_json = 11;
}

message RoutePutEndRequest {
  PeerContext peer = 1;
  anvil.v1.PutToken request = 2;
}

message RouteDeleteRequest {
  PeerContext peer = 1;
  anvil.v1.DeleteRequest request = 2;
}

message RouteDeleteIfVersionRequest {
  PeerContext peer = 1;
  anvil.v1.DeleteIfVersionRequest request = 2;
}

message RouteBulkWriteRequest {
  PeerContext peer = 1;
  anvil.v1.BulkWriteRequest request = 2;
}

message RouteProvisionTenantRequest {
  PeerContext peer = 1;
  anvil.v1.ProvisionTenantRequest request = 2;
}

message RouteCreateBucketRequest {
  PeerContext peer = 1;
  anvil.v1.CreateBucketRequest request = 2;
}

message RouteCredentialExchangeRequest {
  PeerContext peer = 1;
  anvil.v1.ExchangeClientCredentialsRequest request = 2;
}

message RouteAdminCreateApplicationRequest {
  PeerContext peer = 1;
  anvil.v1.CreateApplicationRequest request = 2;
}

message RouteAdminRotateCredentialRequest {
  PeerContext peer = 1;
  anvil.v1.RotateApplicationCredentialRequest request = 2;
}

message RouteAdminDisableCredentialRequest {
  PeerContext peer = 1;
  anvil.v1.DisableApplicationCredentialRequest request = 2;
}

message RouteAdminSetBucketVersioningRequest {
  PeerContext peer = 1;
  anvil.v1.SetBucketVersioningRequest request = 2;
}

message RouteAdminChangeApplicationRoleRequest {
  PeerContext peer = 1;
  anvil.v1.ApplicationRoleRequest request = 2;
  bool granted = 3;
}

message RouteAuthzPutSchemaRequest {
  PeerContext peer = 1;
  anvil.v1.PutSchemaRequest request = 2;
}

message RouteAuthzBindSchemaRequest {
  PeerContext peer = 1;
  anvil.v1.BindSchemaRequest request = 2;
}

message RouteAuthzGetBindingRequest {
  PeerContext peer = 1;
  anvil.v1.GetBindingRequest request = 2;
}

message RouteAuthzGetSchemaRequest {
  PeerContext peer = 1;
  anvil.v1.GetSchemaRequest request = 2;
}

message RouteAuthzMutateTuplesRequest {
  PeerContext peer = 1;
  anvil.v1.MutateTuplesRequest request = 2;
}

message RouteAuthzReadTuplesRequest {
  PeerContext peer = 1;
  anvil.v1.ReadTuplesRequest request = 2;
}

message RouteAuthzCheckPermissionRequest {
  PeerContext peer = 1;
  anvil.v1.CheckPermissionRequest request = 2;
}

message RouteAuthzCheckPermissionsRequest {
  PeerContext peer = 1;
  anvil.v1.CheckPermissionsRequest request = 2;
}

message RouteSetBucketPolicyRequest {
  PeerContext peer = 1;
  anvil.v1.SetBucketPolicyRequest request = 2;
}

message RouteDeleteVersionRequest {
  PeerContext peer = 1;
  anvil.v1.DeleteVersionRequest request = 2;
}

message CoordinateLogicalRecordRequest {
  PeerContext peer = 1;
  bytes typed_value_json = 2;
}

message CoordinateLogicalRecordResponse {
  uint32 schema_version = 1;
}

message CoordinatedLogicalReadRequest {
  PeerContext peer = 1;
  bytes id_json = 2;
}

message CoordinatedLogicalReadResponse {
  uint32 schema_version = 1;
  bool present = 2;
  bytes typed_value_json = 3;
}

message CoordinateSystemGrantRequest {
  PeerContext peer = 1;
  bytes tuple_batch_json = 2;
}

message CoordinateSystemGrantResponse {
  uint32 schema_version = 1;
  bytes receipt_json = 2;
}

message CoordinatePersonalDbAuthorizationRequest {
  PeerContext peer = 1;
  uint64 stable_tenant_id = 2;
  string storage_tenant = 3;
  string owner_app_id = 4;
}

message CoordinatePersonalDbAuthorizationResponse {
  uint32 schema_version = 1;
  uint64 authorization_revision = 2;
  bool replayed = 3;
}

message RouteInvokeProgramRequest {
  PeerContext peer = 1;
  anvil.v1.InvokeProgramRequest request = 2;
}

message RoutePersonalDbExchangeRequest {
  PeerContext peer = 1;
  anvil.v1.PersonalDbExchangeRequest request = 2;
}

message RoutePersonalDbGrantLeaderLeaseRequest {
  PeerContext peer = 1;
  anvil.v1.PersonalDbGrantLeaderLeaseRequest request = 2;
}

message RoutePersonalDbRenewLeaderLeaseRequest {
  PeerContext peer = 1;
  anvil.v1.PersonalDbRenewLeaderLeaseRequest request = 2;
}

message RoutePersonalDbWitnessCommitRequest {
  PeerContext peer = 1;
  anvil.v1.PersonalDbWitnessCommitRequest request = 2;
}

message ProgramStagePathRequest {
  PeerContext peer = 1;
  uint64 executor_nomination_log_index = 2;
  bytes stage_json = 3;
}

message ProgramStagePathResponse {
  uint32 schema_version = 1;
  bytes stage_blob_hash = 2;
  uint64 stage_blob_length = 3;
}

message ProgramCoordinatePathFinalizationRequest {
  PeerContext peer = 1;
  uint64 executor_nomination_log_index = 2;
  uint64 commit_cursor = 3;
  bytes stage_json = 4;
}

message ProgramCoordinatedPathFinalization {
  uint32 schema_version = 1;
  bytes mutation_json = 2;
  bool replayed = 3;
}

message ProgramApplyPathFinalizationRequest {
  PeerContext peer = 1;
  uint64 executor_nomination_log_index = 2;
  bytes mutation_json = 3;
}

message ProgramPathFinalizationApplied {
  uint32 schema_version = 1;
  uint64 version = 2;
  bool replayed = 3;
}

// Narrow internal route for one immutable index artifact or CAS current
// pointer. The authenticated caller must be this index's current weighted-HRW
// builder. Bytes remain on the ordinary upload-source node and the destination
// enters the normal object coordinator pipeline.
message PublishIndexArtifactRequest {
  PeerContext peer = 1;
  string storage_tenant = 2;
  string bucket = 3;
  uint64 tenant_id = 4;
  uint64 bucket_id = 5;
  uint64 index_id = 6;
  string exact_path = 7;
  bytes blob_blake3 = 8;
  uint64 blob_length = 9;
  optional uint64 expected_version = 10;
  string command_id = 11;
}

message IndexArtifactPublished {
  uint32 schema_version = 1;
  uint64 version = 2;
  bool replayed = 3;
}

// Deletes exactly one obsolete immutable generation artifact through the
// ordinary DeleteIfVersion path. `current` and definitions are never valid.
message DeleteIndexArtifactRequest {
  PeerContext peer = 1;
  string storage_tenant = 2;
  string bucket = 3;
  uint64 tenant_id = 4;
  uint64 bucket_id = 5;
  uint64 index_id = 6;
  string exact_path = 7;
  uint64 expected_version = 8;
  string command_id = 9;
}

message IndexArtifactDeleted {
  uint32 schema_version = 1;
  uint64 version = 2;
  bool replayed = 3;
}

message AllIndexDefinitionHeads {}

message IndexGenerationHeads {
  uint64 tenant_id = 1;
  uint64 bucket_id = 2;
  uint64 index_id = 3;
}

message IndexSourceObjectHeads {
  uint64 tenant_id = 1;
  uint64 bucket_id = 2;
  string path_prefix = 3;
}

// A bounded current-head scan with exactly three legal scopes. Reserved
// discovery remains limited to definitions or one numeric index generation.
message ScanIndexHeadsRequest {
  PeerContext peer = 1;
  optional string cursor = 2;
  oneof scope {
    AllIndexDefinitionHeads definitions = 3;
    IndexGenerationHeads generation = 4;
    IndexSourceObjectHeads source_objects = 5;
  }
}

message IndexHeadScanPage {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes source_epoch = 3;
  uint64 placement_term = 4;
  uint64 placement_index = 5;
  repeated bytes heads_json = 6;
  optional string next_cursor = 7;
}

// One decoded, signed public continuation. The public JWT itself is verified
// by ingress; the destination independently verifies the original bearer and
// requires this Zanzibar revision to remain current before returning results.
message RoutedIndexQueryResume {
  uint64 generation = 1;
  bytes last_position = 2;
  uint64 authorization_revision = 3;
}

// A one-hop request to exactly one current weighted-HRW query replica. No
// Caller or authorization decision crosses the wire. The original access JWT
// is carried in gRPC metadata and verified again by the destination.
message RouteIndexQueryRequest {
  PeerContext peer = 1;
  uint64 tenant_id = 2;
  uint64 bucket_id = 3;
  anvil.v1.IndexDefinition definition = 4;
  anvil.v1.IndexQuery query = 5;
  uint32 limit = 6;
  optional RoutedIndexQueryResume resume = 7;
}

// Raw generation results. Public page tokens are minted only by public ingress
// after its own final authorization pass; replicas return engine positions.
message RoutedIndexQueryResponse {
  uint32 schema_version = 1;
  repeated anvil.v1.IndexQueryHit hits = 2;
  anvil.v1.IndexFreshness freshness = 3;
  optional bytes next_position = 4;
  // The peer-routing fence is distinct from freshness. Freshness retains the
  // fence under which the returned generation was built.
  uint64 routing_placement_term = 5;
  uint64 routing_placement_index = 6;
}

// This service is installed only on Anvil's mandatory-mTLS peer listener.
// It exposes typed logical operations, never RocksDB keys, column-family
// values, or a generic public-method tunnel.
service ClusterPeer {
  rpc ResolveTenantName(ResolveTenantNameRequest) returns (ResolveTenantNameResult);
  rpc ResolveBucketName(ResolveBucketNameRequest) returns (ResolveBucketNameResult);
  rpc ReadLogicalRecord(LogicalRecordReadRequest) returns (LogicalRecordCandidate);
  rpc RepairLogicalRecord(LogicalRecordRepairRequest) returns (LogicalRecordSnapshotApplied);
  rpc ApplyLogicalRecord(LogicalRecordMutationRequest) returns (LogicalRecordApplied);

  rpc ApplySchemaPublication(SchemaPublicationApplyRequest) returns (SchemaPublicationApplied);
  rpc HasSchemaPublication(SchemaPublicationQueryRequest) returns (Exists);
  rpc ApplyRealmMutation(RealmMutationApplyRequest) returns (RealmMutationApplied);
  rpc ReadRealmCandidate(RealmCandidateReadRequest) returns (RealmCandidate);
  rpc ReadRealmAggregate(RealmAggregateReadRequest) returns (stream RealmAggregateFrame);
  rpc InstallRealmCandidate(stream RealmCandidateInstallFrame) returns (RealmCandidateInstalled);
  rpc FreshAuthorizationCheck(FreshAuthorizationCheckRequest) returns (FreshAuthorizationCheckResult);
  rpc FreshAuthorizationChecks(FreshAuthorizationChecksRequest) returns (FreshAuthorizationChecksResult);

  rpc ReadReferenceProof(ReferenceProofReadRequest) returns (ReferenceProofReadResponse);
  rpc ListLocalObjects(LocalListRequest) returns (LocalListPage);
  rpc GetWatchStatus(WatchStatusRequest) returns (WatchStatus);
  rpc ReadWatchPage(WatchPageRequest) returns (WatchPage);

  rpc RoutePutEnd(RoutePutEndRequest) returns (anvil.v1.MutationReceipt);
  rpc RouteDelete(RouteDeleteRequest) returns (anvil.v1.MutationReceipt);
  rpc RouteDeleteIfVersion(RouteDeleteIfVersionRequest) returns (anvil.v1.MutationReceipt);
  rpc RouteBulkWrite(RouteBulkWriteRequest) returns (anvil.v1.BulkWriteResponse);
  // Dedicated mandatory-mTLS routes for an in-process trusted adapter. The
  // internal capability is reconstructed at the destination and is never a
  // protobuf field or caller-controlled metadata value.
  rpc RouteInternalDeleteIfVersion(RouteDeleteIfVersionRequest) returns (anvil.v1.MutationReceipt);
  rpc RouteInternalBulkWrite(RouteBulkWriteRequest) returns (anvil.v1.BulkWriteResponse);
  rpc RouteProvisionTenant(RouteProvisionTenantRequest) returns (anvil.v1.ProvisionTenantResponse);
  rpc RouteCreateBucket(RouteCreateBucketRequest) returns (anvil.v1.CreateBucketResponse);
  rpc RouteCredentialExchange(RouteCredentialExchangeRequest) returns (anvil.v1.AccessToken);
  rpc RouteAdminCreateApplication(RouteAdminCreateApplicationRequest) returns (anvil.v1.ApplicationCredential);
  rpc RouteAdminRotateCredential(RouteAdminRotateCredentialRequest) returns (anvil.v1.ApplicationCredential);
  rpc RouteAdminDisableCredential(RouteAdminDisableCredentialRequest) returns (anvil.v1.ApplicationCredentialState);
  rpc RouteAdminSetBucketVersioning(RouteAdminSetBucketVersioningRequest) returns (anvil.v1.SetBucketVersioningResponse);
  rpc RouteAdminChangeApplicationRole(RouteAdminChangeApplicationRoleRequest) returns (anvil.v1.ApplicationRoleResponse);
  rpc RouteInvokeProgram(RouteInvokeProgramRequest) returns (anvil.v1.InvokeProgramResponse);
  rpc RoutePersonalDbExchange(RoutePersonalDbExchangeRequest) returns (anvil.v1.PersonalDbExchangeResponse);
  rpc RoutePersonalDbGrantLeaderLease(RoutePersonalDbGrantLeaderLeaseRequest) returns (anvil.v1.PersonalDbGrantLeaderLeaseResponse);
  rpc RoutePersonalDbRenewLeaderLease(RoutePersonalDbRenewLeaderLeaseRequest) returns (anvil.v1.PersonalDbRenewLeaderLeaseResponse);
  rpc RoutePersonalDbWitnessCommit(RoutePersonalDbWitnessCommitRequest) returns (anvil.v1.PersonalDbWitnessCommitResponse);
  rpc RouteAuthzPutSchema(RouteAuthzPutSchemaRequest) returns (anvil.v1.PutSchemaResponse);
  rpc RouteAuthzBindSchema(RouteAuthzBindSchemaRequest) returns (anvil.v1.BindSchemaResponse);
  rpc RouteAuthzGetBinding(RouteAuthzGetBindingRequest) returns (anvil.v1.GetBindingResponse);
  rpc RouteAuthzGetSchema(RouteAuthzGetSchemaRequest) returns (anvil.v1.GetSchemaResponse);
  rpc RouteAuthzMutateTuples(RouteAuthzMutateTuplesRequest) returns (anvil.v1.MutateTuplesResponse);
  rpc RouteAuthzReadTuples(RouteAuthzReadTuplesRequest) returns (anvil.v1.ReadTuplesResponse);
  rpc RouteAuthzCheckPermission(RouteAuthzCheckPermissionRequest) returns (anvil.v1.CheckPermissionResponse);
  rpc RouteAuthzCheckPermissions(RouteAuthzCheckPermissionsRequest) returns (anvil.v1.CheckPermissionsResponse);
  rpc RouteSetBucketPolicy(RouteSetBucketPolicyRequest) returns (anvil.v1.BucketPolicy);
  rpc RouteDeleteVersion(RouteDeleteVersionRequest) returns (anvil.v1.DeleteVersionResponse);

  rpc StageProgramPath(ProgramStagePathRequest) returns (ProgramStagePathResponse);
  rpc CoordinateProgramPathFinalization(ProgramCoordinatePathFinalizationRequest) returns (ProgramCoordinatedPathFinalization);
  rpc ApplyProgramPathFinalization(ProgramApplyPathFinalizationRequest) returns (ProgramPathFinalizationApplied);

  rpc PublishIndexArtifact(PublishIndexArtifactRequest) returns (IndexArtifactPublished);
  rpc DeleteIndexArtifact(DeleteIndexArtifactRequest) returns (IndexArtifactDeleted);
  rpc ScanIndexHeads(ScanIndexHeadsRequest) returns (IndexHeadScanPage);
  rpc RouteIndexQuery(RouteIndexQueryRequest) returns (RoutedIndexQueryResponse);

  rpc CoordinateLogicalRecord(CoordinateLogicalRecordRequest) returns (CoordinateLogicalRecordResponse);
  rpc ReadCoordinatedLogicalRecord(CoordinatedLogicalReadRequest) returns (CoordinatedLogicalReadResponse);
  rpc CoordinateSystemGrant(CoordinateSystemGrantRequest) returns (CoordinateSystemGrantResponse);
  rpc CoordinatePersonalDbAuthorization(CoordinatePersonalDbAuthorizationRequest) returns (CoordinatePersonalDbAuthorizationResponse);
}
