services:
  keldra:
    image: ${ANVIL_IMAGE:-ghcr.io/keldra-store/keldra:0.1.0}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ANVIL_LISTEN: 0.0.0.0:50051
      ANVIL_DATA_DIR: /var/lib/anvil
      ANVIL_NODE_ID: ${ANVIL_NODE_ID:-1}
      ANVIL_TOKEN_SIGNING_KEY_FILE: /run/secrets/anvil-token-signing-key
      ANVIL_RUN_SYSTEM_BOOTSTRAP: ${ANVIL_RUN_SYSTEM_BOOTSTRAP:-false}
      ANVIL_MAX_ATOMIC_COMMIT_ENTRIES: ${ANVIL_MAX_ATOMIC_COMMIT_ENTRIES:-4096}
      ANVIL_MAX_ATOMIC_COMMIT_BYTES: ${ANVIL_MAX_ATOMIC_COMMIT_BYTES:-16777216}
      ANVIL_AWAITING_PUBLISH_TTL_SECONDS: ${ANVIL_AWAITING_PUBLISH_TTL_SECONDS:-86400}
      ANVIL_MUTATION_RECEIPT_RETENTION_SECONDS: ${ANVIL_MUTATION_RECEIPT_RETENTION_SECONDS:-86400}
      ANVIL_MAX_MUTATION_RECEIPT_ENTRIES: ${ANVIL_MAX_MUTATION_RECEIPT_ENTRIES:-2000000}
      ANVIL_MAX_MUTATION_RECEIPT_BYTES: ${ANVIL_MAX_MUTATION_RECEIPT_BYTES:-536870912}
      ANVIL_SOURCE_JOURNAL_MAX_ENTRIES: ${ANVIL_SOURCE_JOURNAL_MAX_ENTRIES:-1000000}
      ANVIL_SOURCE_JOURNAL_MAX_BYTES: ${ANVIL_SOURCE_JOURNAL_MAX_BYTES:-536870912}
    ports:
      - "50051:50051"
    volumes:
      - keldra_data:/var/lib/anvil
      - ${ANVIL_TOKEN_SIGNING_KEY_FILE:?ANVIL_TOKEN_SIGNING_KEY_FILE must name a mode-0600 file}:/run/secrets/anvil-token-signing-key:ro
    restart: unless-stopped

volumes:
  keldra_data:
