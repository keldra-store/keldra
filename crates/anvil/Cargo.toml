[package]
name = "anvil-server"
version.workspace = true
edition.workspace = true
description = "The Anvil 0.5 object server"
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "anvil"
path = "src/lib.rs"

[[bin]]
name = "anvil-server"
path = "src/main.rs"

[dependencies]
anvil-api = { path = "../anvil-api" }
anvil-atomic-program = { path = "../anvil-atomic-program" }
anvil-authz = { path = "../anvil-authz" }
anvil-consensus = { path = "../anvil-consensus" }
anvil-store = { path = "../anvil-store" }
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
governor = "=0.10.4"
hex = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = "9.3"
libc = "0.2"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "trace"] }
prost = "0.14"
rcgen = { version = "0.13.2", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14"
