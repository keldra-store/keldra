[package]
name = "anvil-server"
version.workspace = true
edition.workspace = true
description = "The Anvil 0.7 object server"
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "anvil"
path = "src/lib.rs"

[[bin]]
name = "anvil-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anvil-api = { path = "../anvil-api" }
anvil-atomic-program = { path = "../anvil-atomic-program" }
anvil-authz = { path = "../anvil-authz" }
anvil-consensus = { path = "../anvil-consensus" }
anvil-index = { path = "../anvil-index" }
anvil-store = { path = "../anvil-store" }
anyhow = "1"
async-stream = "0.3.6"
aws-credential-types = "1"
aws-sigv4 = { version = "1", features = ["sign-http", "http1", "sign-eventstream"] }
aws-smithy-runtime-api = "1"
axum = { version = "0.8.5", features = ["http1", "http2"] }
base64 = "0.22"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
getrandom = "0.3"
governor = "=0.10.4"
hex = "0.4"
hmac = "0.12.1"
http-body-util = "0.1.1"
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = "9.3"
libc = "0.2"
memmap2 = "0.9"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "spec_unstable_metrics_views", "trace"] }
personaldb-protocol = "0.2.2"
prost = "0.14"
prost-types = "0.14"
rcgen = { version = "0.13.2", features = ["pem"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2"
time = "0.3.44"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anvil-storage = { path = "../../clients/rust" }
aws-sdk-s3 = "=1.18.0"
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14"
