name: Resume Anvil Release Publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing 0.5 release tag to publish
        required: true
        type: string
      expected_commit:
        description: Exact commit validated by the source release run
        required: true
        type: string
      source_run_id:
        description: Release run whose validation and image jobs passed
        required: true
        type: string
      expected_image_digest:
        description: Exact multi-architecture GHCR manifest digest
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: anvil-release
  cancel-in-progress: false

jobs:
  publish:
    name: Resume 0.5 publication from validated image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify immutable validation evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?$ ]]; then
            echo "release tag must be an unprefixed semantic version" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected commit must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source run id must be numeric" >&2
            exit 1
          fi

          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$EXPECTED_COMMIT"

          api_headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          run_json="$(
            curl --fail --silent --show-error --location \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          )"
          test "$(jq -r '.name' <<<"$run_json")" = 'Anvil Release'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$EXPECTED_COMMIT"

          jobs_json="$(
            curl --fail --silent --show-error --location \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100"
          )"
          required_jobs=(
            'Resolve immutable release context'
            'Validate Anvil 0.5 release'
            'Build release image (linux/amd64)'
            'Build release image (linux/arm64)'
          )
          for job_name in "${required_jobs[@]}"; do
            conclusion="$(
              jq -r --arg name "$job_name" \
                '[.jobs[] | select(.name == $name) | .conclusion] | if length == 1 then .[0] else "invalid" end' \
                <<<"$jobs_json"
            )"
            if [[ "$conclusion" != success ]]; then
              echo "required source job is not uniquely successful: ${job_name}" >&2
              exit 1
            fi
          done

      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published multi-architecture image
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}"
          inspection="$(docker buildx imagetools inspect "$image")"
          grep -q 'linux/amd64' <<<"$inspection"
          grep -q 'linux/arm64' <<<"$inspection"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspection")"
          if [[ "$digest" != "$EXPECTED_IMAGE_DIGEST" ]]; then
            echo "published image digest does not match validation evidence" >&2
            exit 1
          fi
          printf 'image=%s\ndigest=%s\n' "$image" "$digest" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.expected_commit }}
          generate_release_notes: true
          make_latest: true
          body: |
            Anvil 0.5.2 adds cluster-wide derived indexes to the clustered
            versioned-object and atomic-program server. PersonalDB follows in
            the 0.5.3 capability release.

            - Image: `${{ steps.image.outputs.image }}`
            - Manifest digest: `${{ steps.image.outputs.digest }}`
            - Source commit: `${{ inputs.expected_commit }}`
