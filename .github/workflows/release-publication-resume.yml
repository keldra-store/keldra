name: Resume Keldra Release Publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      expected_commit:
        description: Exact commit validated by the source release run
        required: true
        type: string
      source_run_id:
        description: Release run whose validation and image jobs passed
        required: true
        type: string
      expected_image_digest:
        description: Exact multi-architecture GHCR manifest digest
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: keldra-release
  cancel-in-progress: false

jobs:
  publish:
    name: Resume Keldra publication from validated image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify immutable validation evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?$ ]]; then
            echo "release tag must be an unprefixed semantic version" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected commit must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source run id must be numeric" >&2
            exit 1
          fi

          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$EXPECTED_COMMIT"

          api_headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          run_json="$(
            curl --fail --silent --show-error --location \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          )"
          test "$(jq -r '.name' <<<"$run_json")" = 'Keldra Release'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$EXPECTED_COMMIT"

          jobs_json="$(
            curl --fail --silent --show-error --location \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100"
          )"
          required_jobs=(
            'Resolve immutable release context'
            'Validate Keldra release'
            'Build release image (linux/amd64)'
            'Build release image (linux/arm64)'
          )
          for job_name in "${required_jobs[@]}"; do
            conclusion="$(
              jq -r --arg name "$job_name" \
                '[.jobs[] | select(.name == $name) | .conclusion] | if length == 1 then .[0] else "invalid" end' \
                <<<"$jobs_json"
            )"
            if [[ "$conclusion" != success ]]; then
              echo "required source job is not uniquely successful: ${job_name}" >&2
              exit 1
            fi
          done

      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}

      - name: Download tested release image digests
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: keldra-release-digest-*
          path: ${{ runner.temp }}/keldra-image-digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published multi-architecture image
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}"
          amd64_digest="$(tr -d '[:space:]' < \
            "${RUNNER_TEMP}/keldra-image-digests/keldra-release-digest-amd64/keldra-image-digest-amd64.txt")"
          arm64_digest="$(tr -d '[:space:]' < \
            "${RUNNER_TEMP}/keldra-image-digests/keldra-release-digest-arm64/keldra-image-digest-arm64.txt")"
          for digest in "$amd64_digest" "$arm64_digest" "$EXPECTED_IMAGE_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "release evidence did not contain a valid image digest" >&2
              exit 1
            fi
          done

          raw_manifest="$(docker buildx imagetools inspect --raw "$image")"
          AMD64_DIGEST="$amd64_digest" ARM64_DIGEST="$arm64_digest" python3 -c '
          import json, os, sys
          manifest = json.load(sys.stdin)
          published = sorted(
              (
                  "{}/{}".format(
                      item.get("platform", {}).get("os"),
                      item.get("platform", {}).get("architecture"),
                  ),
                  item.get("digest"),
              )
              for item in manifest.get("manifests", [])
          )
          expected = sorted(
              [
                  ("linux/amd64", os.environ["AMD64_DIGEST"]),
                  ("linux/arm64", os.environ["ARM64_DIGEST"]),
              ]
          )
          if published != expected:
              raise SystemExit(f"published platform digests {published!r} != {expected!r}")
          ' <<<"$raw_manifest"

          inspection="$(docker buildx imagetools inspect "$image")"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspection")"
          if [[ "$digest" != "$EXPECTED_IMAGE_DIGEST" ]]; then
            echo "published image digest does not match validation evidence" >&2
            exit 1
          fi
          printf 'image=%s\ndigest=%s\n' "$image" "$digest" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.expected_commit }}
          generate_release_notes: true
          make_latest: true
          body: |
            Keldra ${{ inputs.tag }} adds typed date fields, zero-copy object
            clones, protected transparent object links, and durable reservations
            that let atomic programs safely operate on authorized ordinary paths
            without requiring PROGRAM_ONLY policy.

            Date fields accept ISO 8601 by default or one configured strftime
            format, normalize to signed Unix epoch milliseconds in the index,
            and support exact, range, order, and facet queries. Clones share the
            source payload without copying bytes but retain independent version
            lineages. Links are mutable aliases to one canonical target: writes
            through any linked name update that target, unlink removes only the
            alias, and target deletion is fenced while inbound links exist.

            This release also fixes sparse optional point-field queries
            incorrectly treating an omitted segment component as corruption
            (#259).

            This release is a clean storage-format break and changes the cluster
            and data-peer protocols. Start 0.15 on fresh authoritative volumes;
            in-place 0.14 volume upgrades and mixed 0.14/0.15 operation are
            unsupported. After all ACTIVE nodes attest support,
            inspect GetClusterCapabilities and explicitly call
            ActivateClusterCapabilities with its exact placement fence to enable
            clone, link, and generalized ordinary-path atomic programs.

            It includes the multi-platform Keldra server image, CLI, Rust client,
            generated API crate, and public qualification clients.

            - Image: `${{ steps.image.outputs.image }}`
            - Manifest digest: `${{ steps.image.outputs.digest }}`
            - Source commit: `${{ inputs.expected_commit }}`
