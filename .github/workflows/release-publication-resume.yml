name: Resume Anvil Release Publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing 0.9 release tag to publish
        required: true
        type: string
      expected_commit:
        description: Exact commit validated by the source release run
        required: true
        type: string
      source_run_id:
        description: Release run whose validation and image jobs passed
        required: true
        type: string
      expected_image_digest:
        description: Exact multi-architecture GHCR manifest digest
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: anvil-release
  cancel-in-progress: false

jobs:
  publish:
    name: Resume 0.9 publication from validated image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Verify immutable validation evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?$ ]]; then
            echo "release tag must be an unprefixed semantic version" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected commit must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source run id must be numeric" >&2
            exit 1
          fi

          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$EXPECTED_COMMIT"

          api_headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          run_json="$(
            curl --fail --silent --show-error --location \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          )"
          test "$(jq -r '.name' <<<"$run_json")" = 'Anvil Release'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$EXPECTED_COMMIT"

          jobs_json="$(
            curl --fail --silent --show-error --location \
              "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100"
          )"
          required_jobs=(
            'Resolve immutable release context'
            'Validate Anvil 0.9 release'
            'Build release image (linux/amd64)'
            'Build release image (linux/arm64)'
          )
          for job_name in "${required_jobs[@]}"; do
            conclusion="$(
              jq -r --arg name "$job_name" \
                '[.jobs[] | select(.name == $name) | .conclusion] | if length == 1 then .[0] else "invalid" end' \
                <<<"$jobs_json"
            )"
            if [[ "$conclusion" != success ]]; then
              echo "required source job is not uniquely successful: ${job_name}" >&2
              exit 1
            fi
          done

      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}

      - name: Download tested release image digests
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: anvil-release-digest-*
          path: ${{ runner.temp }}/anvil-image-digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published multi-architecture image
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}"
          amd64_digest="$(tr -d '[:space:]' < \
            "${RUNNER_TEMP}/anvil-image-digests/anvil-release-digest-amd64/anvil-image-digest-amd64.txt")"
          arm64_digest="$(tr -d '[:space:]' < \
            "${RUNNER_TEMP}/anvil-image-digests/anvil-release-digest-arm64/anvil-image-digest-arm64.txt")"
          for digest in "$amd64_digest" "$arm64_digest" "$EXPECTED_IMAGE_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "release evidence did not contain a valid image digest" >&2
              exit 1
            fi
          done

          raw_manifest="$(docker buildx imagetools inspect --raw "$image")"
          AMD64_DIGEST="$amd64_digest" ARM64_DIGEST="$arm64_digest" python3 -c '
          import json, os, sys
          manifest = json.load(sys.stdin)
          published = sorted(
              (
                  "{}/{}".format(
                      item.get("platform", {}).get("os"),
                      item.get("platform", {}).get("architecture"),
                  ),
                  item.get("digest"),
              )
              for item in manifest.get("manifests", [])
          )
          expected = sorted(
              [
                  ("linux/amd64", os.environ["AMD64_DIGEST"]),
                  ("linux/arm64", os.environ["ARM64_DIGEST"]),
              ]
          )
          if published != expected:
              raise SystemExit(f"published platform digests {published!r} != {expected!r}")
          ' <<<"$raw_manifest"

          inspection="$(docker buildx imagetools inspect "$image")"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspection")"
          if [[ "$digest" != "$EXPECTED_IMAGE_DIGEST" ]]; then
            echo "published image digest does not match validation evidence" >&2
            exit 1
          fi
          printf 'image=%s\ndigest=%s\n' "$image" "$digest" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.expected_commit }}
          generate_release_notes: true
          make_latest: true
          body: |
            Anvil 0.9.0 introduces Anvil-owned format-v4 immutable index
            segments, exact multi-predicate execution, optional Typed JSON
            physical ordering, stable generation-bound cursors, and bounded
            arbitrary sorting. It is a clean index-format release for new
            volumes and does not carry format-v3 compatibility machinery.

            - Image: `${{ steps.image.outputs.image }}`
            - Manifest digest: `${{ steps.image.outputs.digest }}`
            - Source commit: `${{ inputs.expected_commit }}`
