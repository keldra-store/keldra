name: Anvil Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anvil-release
  cancel-in-progress: false

jobs:
  release-context:
    name: Resolve immutable release context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?$ ]]; then
            echo "release tag must be an unprefixed semantic version" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          workspace_version="$(
            git show "${commit}:Cargo.toml" |
              python3 -c 'import re,sys; text=sys.stdin.read(); print(re.search(r"(?ms)^\[workspace\.package\].*?^version\s*=\s*\"([^\"]+)\"", text).group(1))'
          )"
          if [[ "$tag" != "${workspace_version}" ]]; then
            echo "release tag $tag does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$commit" != "$GITHUB_SHA" ]]; then
            echo "tag commit does not match the push event commit" >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >>"$GITHUB_OUTPUT"

  validate:
    name: Validate Anvil 0.8 release
    needs: release-context
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANVIL_GATE_STEP_TIMEOUT_SECONDS: '5400'
      ANVIL_RUST_TEST_THREADS: '8'
      CARGO_BUILD_JOBS: '8'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler \
            ripgrep

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-cargo-v08-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-v08-

      - name: Run static gates
        run: ./scripts/release-gates.sh static

      - name: Run workspace tests
        run: ./scripts/release-gates.sh rust

  build-image:
    name: Build release image (${{ matrix.platform }})
    needs: release-context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      ANVIL_IMAGE: anvil:release-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      ANVIL_DOCKER_PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image by digest
        id: build
        env:
          DIGEST_FILE: ${{ runner.temp }}/anvil-image-digest-${{ matrix.arch }}.txt
          SOURCE_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          metadata_file="${RUNNER_TEMP}/anvil-image-metadata-${{ matrix.arch }}.json"

          docker buildx build \
            --platform "$ANVIL_DOCKER_PLATFORM" \
            --build-arg "ANVIL_SOURCE_REVISION=${SOURCE_COMMIT}" \
            --provenance=false \
            --sbom=false \
            --output "type=image,name=${repository},push=true,push-by-digest=true,name-canonical=true" \
            --metadata-file "$metadata_file" \
            --file crates/anvil/Dockerfile \
            .

          digest="$(
            python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as metadata:
              print(json.load(metadata).get("containerimage.digest", ""))
          ' "$metadata_file"
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "native ${ANVIL_DOCKER_PLATFORM} build did not report a valid digest" >&2
            exit 1
          fi
          printf '%s\n' "$digest" >"$DIGEST_FILE"
          printf 'repository=%s\ndigest=%s\n' "$repository" "$digest" >>"$GITHUB_OUTPUT"

      - name: Pull exact release image digest
        env:
          IMAGE_REPOSITORY: ${{ steps.build.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform "$ANVIL_DOCKER_PLATFORM" "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          docker tag "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" "$ANVIL_IMAGE"

      - name: Smoke release image through gRPC
        run: ./scripts/release-gates.sh image

      - name: Upload tested release image digest
        uses: actions/upload-artifact@v4
        with:
          name: anvil-release-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/anvil-image-digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 2

      - name: Remove local image
        if: always()
        env:
          IMAGE_REPOSITORY: ${{ steps.build.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker image rm "$ANVIL_IMAGE" || true
          if [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            docker image rm "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" || true
          fi

  publish:
    name: Publish Anvil 0.8 image and release
    needs: [release-context, validate, build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Download tested release image digests
        uses: actions/download-artifact@v4
        with:
          pattern: anvil-release-digest-*
          path: ${{ runner.temp }}/anvil-image-digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release tag is still pinned
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "release tag moved after validation: ${actual_commit} != ${EXPECTED_COMMIT}" >&2
            exit 1
          fi

      - name: Publish multi-architecture image
        id: image
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          final_image="${repository}:${RELEASE_TAG}"
          amd64_digest="$(tr -d '[:space:]' < \
            "${RUNNER_TEMP}/anvil-image-digests/anvil-release-digest-amd64/anvil-image-digest-amd64.txt")"
          arm64_digest="$(tr -d '[:space:]' < \
            "${RUNNER_TEMP}/anvil-image-digests/anvil-release-digest-arm64/anvil-image-digest-arm64.txt")"

          for digest in "$amd64_digest" "$arm64_digest"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "tested release artifact did not contain a valid digest" >&2
              exit 1
            fi
          done

          docker buildx imagetools create \
            --tag "$final_image" \
            "${repository}@${amd64_digest}" \
            "${repository}@${arm64_digest}"

          raw_manifest="$(docker buildx imagetools inspect --raw "$final_image")"
          AMD64_DIGEST="$amd64_digest" ARM64_DIGEST="$arm64_digest" python3 -c '
          import json, os, sys
          manifest = json.load(sys.stdin)
          published = {
              "{}/{}".format(
                  item.get("platform", {}).get("os"),
                  item.get("platform", {}).get("architecture"),
              ): item.get("digest")
              for item in manifest.get("manifests", [])
          }
          expected = {
              "linux/amd64": os.environ["AMD64_DIGEST"],
              "linux/arm64": os.environ["ARM64_DIGEST"],
          }
          if published != expected:
              raise SystemExit(f"published platform digests {published!r} != {expected!r}")
          ' <<<"$raw_manifest"
          inspection="$(docker buildx imagetools inspect "$final_image")"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspection")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "published image did not report a manifest digest" >&2
            exit 1
          fi
          printf 'image=%s\ndigest=%s\n' "$final_image" "$digest" >>"$GITHUB_OUTPUT"

      - name: Verify release tag before GitHub publication
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "release tag moved during publication: ${actual_commit} != ${EXPECTED_COMMIT}" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          target_commitish: ${{ needs.release-context.outputs.commit }}
          generate_release_notes: true
          make_latest: true
          body: |
            Anvil 0.8.0 builds source-complete indexes with bounded direct bulk
            construction, packed format-v3 artifacts, compressed postings, and
            lossless journal backpressure.

            - Image: `${{ steps.image.outputs.image }}`
            - Manifest digest: `${{ steps.image.outputs.digest }}`
            - Source commit: `${{ needs.release-context.outputs.commit }}`
