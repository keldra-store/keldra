name: Anvil Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anvil-release
  cancel-in-progress: false

jobs:
  release-context:
    name: Resolve immutable release context
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?$ ]]; then
            echo "release tag must be a semantic v-prefixed version" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          workspace_version="$(
            git show "${commit}:Cargo.toml" |
              python3 -c 'import re,sys; text=sys.stdin.read(); print(re.search(r"(?ms)^\[workspace\.package\].*?^version\s*=\s*\"([^\"]+)\"", text).group(1))'
          )"
          if [[ "$tag" != "v${workspace_version}" ]]; then
            echo "release tag $tag does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$commit" != "$GITHUB_SHA" ]]; then
            echo "tag commit does not match the push event commit" >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >>"$GITHUB_OUTPUT"

  validate:
    name: Validate Anvil 0.5 release
    needs: release-context
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 120
    env:
      ANVIL_GATE_STEP_TIMEOUT_SECONDS: '5400'
      ANVIL_RUST_TEST_THREADS: '8'
      CARGO_BUILD_JOBS: '8'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler \
            ripgrep

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-cargo-v05-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-v05-

      - name: Run static gates
        run: ./scripts/release-gates.sh static

      - name: Run workspace tests
        run: ./scripts/release-gates.sh rust

  build-image:
    name: Build release image (${{ matrix.platform }})
    needs: release-context
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 90
    env:
      ANVIL_IMAGE: anvil:release-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      ANVIL_DOCKER_PLATFORM: ${{ matrix.platform }}
      ANVIL_BUILD_PROFILE: release
      ANVIL_USE_NATIVE_CARGO: '0'
      CARGO_BUILD_JOBS: '8'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            artifact: anvil-release-image-amd64
          - platform: linux/arm64
            arch: arm64
            artifact: anvil-release-image-arm64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-cargo-v05-image-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-v05-image-${{ matrix.arch }}-

      - name: Install pinned cross-build toolchain
        run: |
          if ! cargo-zigbuild --version 2>/dev/null | grep -Fxq 'cargo-zigbuild 0.20.1'; then
            cargo install cargo-zigbuild --version 0.20.1 --locked --force
          fi

      - name: Build release image
        run: ./scripts/build-image.sh

      - name: Smoke release image through gRPC
        run: ./scripts/release-gates.sh image

      - name: Export image artifact
        run: docker save "$ANVIL_IMAGE" -o "${{ runner.temp }}/${{ matrix.artifact }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Remove local image
        if: always()
        run: docker image rm "$ANVIL_IMAGE" || true

  publish:
    name: Publish Anvil 0.5 image and release
    needs: [release-context, validate, build-image]
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Download release images
        uses: actions/download-artifact@v4
        with:
          pattern: anvil-release-image-*
          path: ${{ runner.temp }}/anvil-images

      - name: Load release images
        run: |
          docker load -i "${{ runner.temp }}/anvil-images/anvil-release-image-amd64/anvil-release-image-amd64.tar"
          docker load -i "${{ runner.temp }}/anvil-images/anvil-release-image-arm64/anvil-release-image-arm64.tar"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        id: image
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          amd64_local="anvil:release-amd64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          arm64_local="anvil:release-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          amd64_image="${repository}:${RELEASE_TAG}-amd64"
          arm64_image="${repository}:${RELEASE_TAG}-arm64"
          final_image="${repository}:${RELEASE_TAG}"

          docker tag "$amd64_local" "$amd64_image"
          docker tag "$arm64_local" "$arm64_image"
          docker push "$amd64_image"
          docker push "$arm64_image"
          docker buildx imagetools create --tag "$final_image" "$amd64_image" "$arm64_image"

          inspection="$(docker buildx imagetools inspect "$final_image")"
          grep -q 'linux/amd64' <<<"$inspection"
          grep -q 'linux/arm64' <<<"$inspection"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspection")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "published image did not report a manifest digest" >&2
            exit 1
          fi
          printf 'image=%s\ndigest=%s\n' "$final_image" "$digest" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          target_commitish: ${{ needs.release-context.outputs.commit }}
          generate_release_notes: true
          make_latest: true
          body: |
            Anvil 0.5 is a breaking release of the minimal versioned object server.

            - Image: `${{ steps.image.outputs.image }}`
            - Manifest digest: `${{ steps.image.outputs.digest }}`
            - Source commit: `${{ needs.release-context.outputs.commit }}`
