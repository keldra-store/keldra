name: Publish candidate image

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character source commit represented by the artifact
        required: true
        type: string
      image_tag:
        description: Candidate tag, for example v0.5.0-rc1-amd64
        required: true
        type: string
      staging_release:
        description: Draft GitHub release containing the qualified image archive
        required: true
        type: string
      staging_asset:
        description: Qualified .tar.zst image archive filename
        required: true
        type: string
      expected_archive_sha256:
        description: SHA-256 of the compressed image archive
        required: true
        type: string
      expected_image_id:
        description: "Docker image ID, including the sha256: prefix"
        required: true
        type: string
      expected_server_sha256:
        description: SHA-256 of /usr/local/bin/anvil-server in the image
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: anvil-candidate-image-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  STAGING_RELEASE: ${{ inputs.staging_release }}
  STAGING_ASSET: ${{ inputs.staging_asset }}
  EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
  EXPECTED_IMAGE_ID: ${{ inputs.expected_image_id }}
  EXPECTED_SERVER_SHA256: ${{ inputs.expected_server_sha256 }}

jobs:
  publish-amd64:
    name: Verify and publish linux/amd64
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 90
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate requested source and tag
        id: candidate
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_BRANCH: main
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be an exact lowercase 40-character Git SHA" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,126}-amd64$ ]]; then
            echo "image_tag must be a v-prefixed Docker tag ending in -amd64" >&2
            exit 1
          fi
          if [[ ! "$STAGING_RELEASE" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,126}$ ]]; then
            echo "staging_release must be a v-prefixed GitHub release tag" >&2
            exit 1
          fi
          if [[ ! "$STAGING_ASSET" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*\.tar\.zst$ ]]; then
            echo "staging_asset must be a plain .tar.zst filename" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "expected_archive_sha256 must be a lowercase SHA-256" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "expected_image_id must be a sha256-prefixed lowercase digest" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SERVER_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "expected_server_sha256 must be a lowercase SHA-256" >&2
            exit 1
          fi
          git fetch --no-tags --depth=256 origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git merge-base --is-ancestor \
            "$SOURCE_COMMIT" "refs/remotes/origin/${SOURCE_BRANCH}"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf 'image=ghcr.io/%s:%s\n' \
            "${GITHUB_REPOSITORY,,}" "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download and verify qualified image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.candidate.outputs.image }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          release_metadata="$(
            gh release view "$STAGING_RELEASE" \
              --json isDraft,targetCommitish \
              --jq '[.isDraft, .targetCommitish] | @tsv'
          )"
          test "$release_metadata" = $'true\t'"$SOURCE_COMMIT"
          gh release download "$STAGING_RELEASE" \
            --pattern "$STAGING_ASSET" \
            --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/$STAGING_ASSET"
          printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" "$archive" |
            sha256sum --check --strict -
          zstd --decompress --stdout "$archive" | docker load
          test "$(docker image inspect "$EXPECTED_IMAGE_ID" --format '{{.Id}}')" = \
            "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect "$EXPECTED_IMAGE_ID" --format '{{.Os}}/{{.Architecture}}')" = \
            "linux/amd64"
          server_sha="$(
            docker run --platform linux/amd64 --rm \
              --entrypoint sha256sum "$EXPECTED_IMAGE_ID" \
              /usr/local/bin/anvil-server |
              awk '{print $1}'
          )"
          test "$server_sha" = "$EXPECTED_SERVER_SHA256"
          docker tag "$EXPECTED_IMAGE_ID" "$IMAGE"

      - name: Smoke check image binaries
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          timeout 30s docker run --platform linux/amd64 --rm "$IMAGE" anvil-server --version
          timeout 30s docker run --platform linux/amd64 --rm "$IMAGE" anvil --version

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable candidate
        id: publish
        shell: bash
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = \
            "linux/amd64"
          repository="${IMAGE%:*}"
          digest="$(
            docker image inspect "$IMAGE" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' |
              grep -F "${repository}@sha256:" |
              head -n 1
          )"
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            printf '### Candidate image\n\n'
            printf -- '- Source: `%s`\n' "$SOURCE_COMMIT"
            printf -- '- Image: `%s`\n' "$IMAGE"
            printf -- '- Digest: `%s`\n' "$digest"
            printf -- '- Image ID: `%s`\n' "$EXPECTED_IMAGE_ID"
            printf -- '- Server SHA-256: `%s`\n' "$EXPECTED_SERVER_SHA256"
            printf -- '- Platform: `linux/amd64`\n'
          } >> "$GITHUB_STEP_SUMMARY"
