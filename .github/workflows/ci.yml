name: Keldra CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler \
            ripgrep

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v09-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v09-

      - name: Run static release gates
        run: ./scripts/release-gates.sh static

  rust:
    name: Keldra 0.10 workspace tests
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANVIL_GATE_STEP_TIMEOUT_SECONDS: '4800'
      ANVIL_RUST_TEST_THREADS: '8'
      CARGO_BUILD_JOBS: '8'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v09-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v09-

      - name: Run workspace tests
        run: ./scripts/release-gates.sh rust

  build-image:
    name: Build and smoke Keldra image (${{ matrix.platform }})
    needs: static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ANVIL_DOCKER_PLATFORM: ${{ matrix.platform }}
      ANVIL_IMAGE: keldra:test-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: ./scripts/build-image.sh

      - name: Smoke image through the 0.9 gRPC API
        run: ./scripts/release-gates.sh image

      - name: Remove local image
        if: always()
        run: docker image rm "$ANVIL_IMAGE" || true
