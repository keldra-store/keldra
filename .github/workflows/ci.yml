name: Anvil CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  static:
    name: Static checks
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler \
            ripgrep

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v05-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v05-

      - name: Run static release gates
        run: ./scripts/release-gates.sh static

  rust:
    name: Anvil 0.5 workspace tests
    needs: static
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 90
    env:
      ANVIL_GATE_STEP_TIMEOUT_SECONDS: '4800'
      ANVIL_RUST_TEST_THREADS: '8'
      CARGO_BUILD_JOBS: '8'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v05-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v05-

      - name: Run workspace tests
        run: ./scripts/release-gates.sh rust

  build-image:
    name: Build and smoke Anvil image (${{ matrix.platform }})
    needs: static
    runs-on: [self-hosted, linux, x64, worka-builder-2]
    timeout-minutes: 90
    env:
      ANVIL_DOCKER_PLATFORM: ${{ matrix.platform }}
      ANVIL_IMAGE: anvil:test-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      ANVIL_BUILD_PROFILE: ci
      ANVIL_USE_NATIVE_CARGO: '0'
      ANVIL_RUNTIME_BASE: debian:trixie-slim
      CARGO_BUILD_JOBS: '8'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            artifact: anvil-test-image-amd64
          - platform: linux/arm64
            arch: arm64
            artifact: anvil-test-image-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            pkg-config \
            protobuf-compiler

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v05-image-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v05-image-${{ matrix.arch }}-

      - name: Install pinned cross-build toolchain
        run: |
          if ! cargo-zigbuild --version 2>/dev/null | grep -Fxq 'cargo-zigbuild 0.20.1'; then
            cargo install cargo-zigbuild --version 0.20.1 --locked --force
          fi

      - name: Build image
        run: ./scripts/build-image.sh

      - name: Smoke image through the 0.5 gRPC API
        run: ./scripts/release-gates.sh image

      - name: Export image artifact
        run: docker save "$ANVIL_IMAGE" -o "${{ runner.temp }}/${{ matrix.artifact }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove local image
        if: always()
        run: docker image rm "$ANVIL_IMAGE" || true
