name: Keldra Three-Node Qualification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable Keldra release tag to qualify
        required: true
        default: 0.17.1
        type: string
      image:
        description: Published Keldra image matching the release tag
        required: true
        default: ghcr.io/keldra-store/keldra:0.17.1
        type: string

permissions:
  contents: read

concurrency:
  group: three-node-qualification-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify ${{ inputs.release_tag }} across three nodes
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
      KELDRA_DOCKER_PLATFORM: linux/amd64
      KELDRA_IMAGE: ${{ inputs.image }}
      KELDRA_QUALIFICATION_MODE: release
      KELDRA_QUALIFICATION_KEEP: "0"
    steps:
      - name: Validate requested release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an exact stable semantic version" >&2
            exit 2
          fi
          expected_image="ghcr.io/keldra-store/keldra:${RELEASE_TAG}"
          if [[ "$RELEASE_IMAGE" != "$expected_image" ]]; then
            echo "image must be the exact release image ${expected_image}" >&2
            exit 2
          fi

      - name: Checkout requested release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          submodules: recursive

      - name: Use runner-local Cargo target
        run: printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/keldra-cargo-target" >> "$GITHUB_ENV"

      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD^{commit})"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "checkout ${head_commit} does not match tag ${RELEASE_TAG} at ${tag_commit}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "qualification checkout is not clean" >&2
            exit 1
          fi
          echo "Qualifying ${RELEASE_TAG} at ${head_commit}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.96.0

      - name: Install qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            jq \
            libclang-dev \
            pkg-config \
            protobuf-compiler
          docker compose version

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-three-node-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-three-node-cargo-

      - name: Pull exact published release image
        run: docker pull --platform "$KELDRA_DOCKER_PLATFORM" "$KELDRA_IMAGE"

      - name: Run three-node release qualification
        run: ./scripts/qualify-three-node.sh
