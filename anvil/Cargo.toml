[package]
name = "anvil-server"
version.workspace = true
edition.workspace = true
description = "The Anvil 0.5 object server"
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "anvil"
path = "src/lib.rs"

[[bin]]
name = "anvil-server"
path = "src/main.rs"

[dependencies]
anvil-api = { path = "../crates/anvil-api" }
anvil-atomic-program = { path = "../crates/anvil-atomic-program" }
anvil-authz = { path = "../crates/anvil-authz" }
anvil-consensus = { path = "../crates/anvil-consensus" }
anvil-store = { path = "../crates/anvil-store" }
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
jsonwebtoken = "9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
