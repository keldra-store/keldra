services:
  anvil:
    image: ${ANVIL_IMAGE:-ghcr.io/worka-ai/anvil:0.5.0}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ANVIL_LISTEN: 0.0.0.0:50051
      ANVIL_DATA_DIR: /var/lib/anvil
      ANVIL_NODE_ID: ${ANVIL_NODE_ID:-1}
      ANVIL_MAX_ATOMIC_COMMIT_ENTRIES: ${ANVIL_MAX_ATOMIC_COMMIT_ENTRIES:-4096}
      ANVIL_MAX_ATOMIC_COMMIT_BYTES: ${ANVIL_MAX_ATOMIC_COMMIT_BYTES:-16777216}
      ANVIL_API_TOKEN: ${ANVIL_API_TOKEN:?ANVIL_API_TOKEN must be set}
    ports:
      - "50051:50051"
    volumes:
      - anvil_data:/var/lib/anvil
    restart: unless-stopped

volumes:
  anvil_data:
