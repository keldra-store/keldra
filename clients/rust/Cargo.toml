[package]
name = "keldra"
version.workspace = true
edition.workspace = true
description = "Authenticated Rust client for Keldra objects and indices"
rust-version.workspace = true
license-file = "../../LICENSE"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/keldra"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
keldra-api = { version = "=0.14.0", path = "../../crates/keldra-api" }
serde_json = "1.0"
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt"] }
