[workspace]
resolver = "3"

members = [
    "clients/rust",
    "crates/anvil",
    "crates/anvil-api",
    "crates/anvil-authz",
    "crates/anvil-atomic-program",
    "crates/anvil-cli",
    "crates/anvil-consensus",
    "crates/anvil-index",
    "crates/anvil-osv-qualification",
    "crates/anvil-store",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
readme = "README.md"
description = "Opaque versioned object storage with bounded atomic programs"
keywords = ["object-store", "storage", "compare-and-swap", "distributed-systems"]
categories = ["database-implementations"]
authors = ["Anvil maintainers <maintainers@anvil.storage>"]
license = "Apache-2.0"
homepage = "https://anvil.storage"
documentation = "https://anvil.storage"
rust-version = "1.96.0"

[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"
incremental = false
