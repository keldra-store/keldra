[workspace]
resolver = "3"

members = [
    "clients/rust",
    "crates/keldra",
    "crates/keldra-api",
    "crates/keldra-authz",
    "crates/keldra-atomic-program",
    "crates/keldra-cli",
    "crates/keldra-consensus",
    "crates/keldra-index",
    "crates/keldra-osv-qualification",
    "crates/keldra-store",
    "integrations/zanzibar",
]

[workspace.package]
version = "0.17.0"
edition = "2024"
readme = "README.md"
description = "Opaque versioned object storage with bounded atomic programs"
keywords = ["object-store", "storage", "compare-and-swap", "distributed-systems"]
categories = ["database-implementations"]
authors = ["Keldra maintainers <maintainers@keldra.store>"]
license = "Apache-2.0"
homepage = "https://keldra.store"
documentation = "https://keldra.store"
repository = "https://github.com/keldra-store/keldra"
rust-version = "1.96.0"

[patch.crates-io]
# The integrated Zanzibar workspace validates against the candidate Keldra
# client. Zanzibar's own manifest remains an exact crates.io dependency when
# checked out and released on its own.
keldra = { path = "clients/rust" }

[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"
incremental = false
